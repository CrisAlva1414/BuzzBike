# Version catalog — BuzzBike
# Versions resolved against real Maven/Google metadata on 2026-10-26.
# Do not invent numbers: bump only after verifying the artifact resolves.
#
# ---------------------------------------------------------------------------
# Matriz de versiones — CAMINO A (elegido 2026-10-26) y por qué:
#
# La matriz anterior (AGP 8.13.2 + Hilt 2.60.1) era inconsistente: Hilt
# 2.60.x exige AGP >= 9.0.0 (falla al aplicar el plugin). Solo dos mezclas
# son válidas:
#   - Camino A: AGP 9.4.1 + Gradle 9.8.2 + Hilt 2.60.1 (todo stable actual)
#   - Camino B: AGP 8.13.2 + Gradle 8.14.5 + Hilt <= 2.59.2
# Se eligió el A porque además de resolver el choque Hilt/AGP nos deja en
# la toolchain stable más nueva (Kotlin 2.4.21, KSP independiente 2.3.12);
# el camino B habría forzado Kotlin 2.2.21 + KSP con esquema acoplado.
# KSP pasó a versionado independiente en 2.3.0: ya NO existe KSP 2.4.x ni
# scheme "kotlinVersion-kspVersion"; se usa el último standalone (2.3.12),
# cuya compatibilidad con Kotlin 2.4.21 se valida en cada build del gate.
# ---------------------------------------------------------------------------

[versions]
agp = "9.4.1"
kotlin = "2.4.21"            # pins kotlin-compose plugin only (built-in Kotlin compiles sources)
ksp = "2.3.12"               # KSP independent scheme (>=2.3.0); last stable
hilt = "2.60.1"              # requires AGP >= 9.0.0 — pair with agp 9.x only
composeBom = "2026.09.00"
room = "2.8.5"
ktlint = "14.2.0"             # jlleitschuh ktlint-gradle plugin
detekt = "1.23.8"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
coroutines = "1.10.2"         # matches turbine 1.2.1 declared dep
maplibre = "13.7.1"
junit = "4.13.2"
turbine = "1.2.1"
playServicesLocation = "21.3.0"
hiltNavigationCompose = "1.4.0"
robolectric = "4.16.1"        # JVM Room/DAO tests without a device
androidxTestCore = "1.7.0"    # ApplicationProvider for Robolectric
androidxTestExtJunit = "1.2.1" # AndroidJUnit4 runner for instrumented tests
androidxTestRunner = "1.6.2"   # AndroidJUnitRunner (androidTest)
androidxTestRules = "1.6.1"    # JUnit rules for instrumented tests
workManager = "2.10.5"        # background outbox sync with network constraint
sqlcipher = "4.9.0"           # Room database encryption at rest (S2)

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# NO `org.jetbrains.kotlin.android` in this catalog: AGP 9 built-in Kotlin
# compiles the sources and applying KGP's android plugin is a hard error.
# `kotlin` version below only pins the Compose compiler plugin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

