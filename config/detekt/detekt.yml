# detekt — BuzzBike
# Analyzer de estilo + complejidad. El formatter/linter de formato es ktlint
# (ver .editorconfig y docs/format/estilo-kotlin.md).
#
# buildUponDefaultConfig = true en app/build.gradle.kts; este archivo
# sobreescribe/activa lo que el proyecto necesita explícitamente.
#
# >>> REGLA DE DOMINIO FÍSICO (AGENTS.md §6) <<<
# Toda fórmula de dominio físico (calorías, BMR, MET, wear ratios) requiere
# revisión humana con fuente citada en KDoc + ADR. Detekt NO puede validar
# correctness científica — solo complejidad/estilo. Un diff que agregue o
# cambie constantes fisiológicas en domain/ pasa detekt igual; el gate real
# es el review humano + ADR. No relajar este flujo para "dejar pasar" código.

build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongMethod: 1
    TooManyFunctions: 1
    LabeledExpression: 1
    MagicNumber: 1
    ReturnCount: 1
    NestedBlockDepth: 1

complexity:
  active: true
  LongMethod:
    active: true
    # 60 líneas: un Composable complejo o un mapper largo. Estilo §2.
    threshold: 60
    ignoreAnnotated: ['Composable', 'Preview']
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: true
    thresholdInFiles: 11
    thresholdInClasses: 11
    thresholdInObjects: 11
    thresholdInInterfaces: 11
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePrivate: false
    ignoreOverridden: false
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreAnnotated: ['Composable']
  ComplexCondition:
    active: true
    threshold: 4
  LabeledExpression:
    active: true
    ignoredLabels: ['LOOP', 'WHEN']
  NestedBlockDepth:
    active: true
    threshold: 4

naming:
  active: true
  FunctionNaming:
    active: true
    # Compose functions are PascalCase by convention (docs §1).
    ignoreAnnotated: ['Composable']
  VariableNaming:
    active: true
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'
  MemberNameEqualsClassName:
    active: true
    ignoreOverridden: true
  FunctionMaxLength:
    active: false

style:
  active: true
  ThrowsCount:
    active: true
    max: 2
    excludeGuardClauses: false
  UnnecessaryParentheses:
    active: true
  MagicNumber:
    active: true
    # 0, 1, -1 son triviales; el resto require constantes con nombre
    # (SCREAMING_SNAKE_CASE) — crítico para constantes fisiológicas del
    # dominio (AGENTS.md §6: sin fuente citada no se implementa).
    ignoreNumbers: ['-1', '0', '1', '2']
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: false
    ignoreExtensionFunctions: true
  ReturnCount:
    active: true
    max: 2
    excludeGuardClauses: false
  ForbiddenComment:
    active: true
    # TODOs are project convention (AGENTS.md §11), so every marker is allowed.
    comments:
      - reason: 'TODO markers are project convention (AGENTS.md §11)'
        value: 'TODO:'
      - reason: 'TODO markers are project convention (AGENTS.md §11)'
        value: 'FIXME:'
      - reason: 'TODO markers are project convention (AGENTS.md §11)'
        value: 'XXX:'
      - reason: 'TODO markers are project convention (AGENTS.md §11)'
        value: 'HACK:'
    allowedPatterns: '.*'
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
    ignoreAnnotated: ['Preview', 'Composable']
  ForbiddenVoid:
    active: true
    ignoreOverridden: false
  UnnecessaryAbstractClass:
    active: true
  UseCheckOrError:
    active: false   # domain uses Result/sealed, not exceptions (estilo §5)
  UseRequire:
    active: false

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalMonitorStateException'
      - 'NullPointerException'
      - 'IndexOutOfBoundsException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '(ignore|expected).*'
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'NumberFormatException'
      - 'ParseException'
      - 'MalformedURLException'
    allowedExceptionNameRegex: '(ignore|expected).*'
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
  ThrowingExceptionFromFinally:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  ThrowingNewInstanceOfSameException:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
    # Se permite `!!` solo con justificación documentada (estilo §3).
  UnsafeCast:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true   # estilo §6: no GlobalScope
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true
  RedundantSuspendModifier:
    active: true

# --- Exclusiones de código generado (Hilt, Room, KSP, BuildConfig) ---
processors:
  active: true
  excludes: ['**/generated/**', '**/build/**']

comments:
  active: true
  CommentOverPrivateFunction:
    active: false
  CommentOverPrivateProperty:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
