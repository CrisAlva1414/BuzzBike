# JVM args for Gradle daemon and Kotlin compile daemon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX — required for modern Android libraries (Jetpack, Compose, Room, Hilt).
android.useAndroidX=true

# Non-transitive R classes: each module only sees its own R.
# Faster builds, fewer accidental resource leaks across modules.
android.nonTransitiveRClass=true

# Kotlin official code style (matches ktlint_official / docs/format/estilo-kotlin.md).
kotlin.code.style=official

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---------------------------------------------------------------------------
# Telemetry / analytics — DISABLED
# BuzzBike is local-first (AGENTS.md §7): no third-party analytics, no crash
# reporting that phones home, no accounts. We deliberately do NOT add any
# Google/Firebase/analytics dependency. The flags below keep AGP/Gradle from
# opting into experimental data-collection surfaces if they appear.
# ---------------------------------------------------------------------------
# Do not enable Android Studio/AGP metrics reporting in CI or local builds.
android.experimental.enableScreenshotTest=false
